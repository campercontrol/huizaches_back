version: "3"

services:
  src:
    build: .
    working_dir: /app
    container_name: "src_camp_container"
    volumes:
      - ./app/:/app
    ports:
      - "8000:8080"
    restart: on-failure:10
    #Actualizacion e instalacion
    # command: bash -c "alembic revision --autogenerate && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8080 --reload --ssl-keyfile=./app/key.pem --ssl-certfile=./app/cert.pem"
    #Solo instalacion
    command: bash -c "uvicorn main:app --host 0.0.0.0 --port 8080 --reload"